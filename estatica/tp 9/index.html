<!DOCTYPE html>
<html lang="es">
    <head>
        <title>Formulario</title>
        <link rel="stylesheet" href="index.css">
        <meta charset="UTF-8">
    </head>
    <body>
        <h1>Formulario</h1>
        <div class="container">
            <form action="#" method="get">
                <div class="form-group">
                    <div class="form-group-column">
                        <div class="form-group-item">
                            <label for="nombre">Nombre:</label>
                            <input type="text" id="nombre" name="nombre" placeholder="Nombre" required>
                        </div>
                        <div class="form-group-item">
                            <label for="apellido">Apellido:</label>
                            <input type="text" id="apellido" name="apellido" placeholder="Apellido" required>
                        </div>
                        <div class="form-group-item">
                            <label for="nombre_usuario">Nombre de usuario:</label>
                            <input type="text" id="nombre_usuario" name="nombre_usuario" placeholder="Nombre de usuario" minlength="4" maxlength="12" required>
                        </div>
                        <div class="form-group-item">
                            <label for="ciudad">Ciudad:</label>
                            <input type="text" id="ciudad" name="ciudad" value="Neuquén" placeholder="Ciudad" required>
                        </div>
                        <div class="form-group-item">
                            <label for="pais">País:</label>
                            <select name="pais" id="pais" required>
                                <option value="argentina">Argentina</option>
                                <option value="chile">Chile</option>
                                <option value="brasil">Brasil</option>
                                <option value="uruguay">Uruguay</option>
                                <option value="paraguay">Paraguay</option>
                                <option value="japon">Japón</option>
                                <option value="otro">Otro</option>
                            </select>
                        </div>
                        <div class="form-group-item">
                            <label for="email">Email:</label>
                            <input type="email" id="email" name="email" placeholder="Email" required>
                        </div>
                        <div class="form-group-item">
                            <label for="contraseña">Contraseña:</label>
                            <input type="password" id="contraseña" name="contraseña" placeholder="Contraseña" required minlength="6" maxlength="20">
                        </div>
                        <div class="form-group-item">
                            <label for="edad">Edad:</label>
                            <input type="number" id="edad" name="edad" placeholder="Edad" min="18" max="99" required>
                        </div>
                        <div class="form-group-item">
                            <label for="acompanantes">Cantidad de acompañantes:</label>
                            <input type="number" id="acompanantes" name="acompanantes" min="0" max="5" required>
                        </div>
                        <div class="form-group-item">
                            <label for="fecha_nacimiento">Fecha de nacimiento:</label>
                            <input type="date" id="fecha_nacimiento" name="fecha_nacimiento" required>
                        </div>
                        <div class="form-group-item">
                            <label for="hora_contacto">Hora preferida de contacto:</label>
                            <input type="time" id="hora_contacto" name="hora_contacto">
                        </div>

                        <fieldset class="modalidad-fieldset">
                            <legend>Modalidad de cursado</legend>
                            <div class="radio-group">
                                <div class="radio-row">
                                    <input type="radio" id="presencial" name="modalidad" value="presencial" required>
                                    <label for="presencial">Presencial</label>
                                </div>
                                <div class="radio-row">
                                    <input type="radio" id="virtual" name="modalidad" value="virtual">
                                    <label for="virtual">Virtual</label>
                                </div>
                                <div class="radio-row">
                                    <input type="radio" id="mixta" name="modalidad" value="mixta">
                                    <label for="mixta">Mixta</label>
                                </div>
                            </div>
                        </fieldset>

                        <fieldset class="intereses-fieldset">
                            <legend>Intereses</legend>
                            <div class="checkbox-group">
                                <div class="checkbox-row">
                                    <input type="checkbox" id="interes_html" name="intereses" value="html">
                                    <label for="interes_html">HTML</label>
                                </div>
                                <div class="checkbox-row">
                                    <input type="checkbox" id="interes_css" name="intereses" value="css">
                                    <label for="interes_css">CSS</label>
                                </div>
                                <div class="checkbox-row">
                                    <input type="checkbox" id="interes_js" name="intereses" value="javascript">
                                    <label for="interes_js">JavaScript</label>
                                </div>
                                <div class="checkbox-row">
                                    <input type="checkbox" id="interes_diseno" name="intereses" value="diseno_web">
                                    <label for="interes_diseno">Diseño web</label>
                                </div>
                                <div class="checkbox-row">
                                    <input type="checkbox" id="interes_backend" name="intereses" value="backend">
                                    <label for="interes_backend">Backend</label>
                                </div>
                            </div>
                        </fieldset>

                        <div class="form-group-item">
                            <label for="sugerencias">Sugerencias:</label>
                            <textarea name="sugerencias" id="sugerencias" rows="5" cols="40" placeholder="Sugerencias"></textarea>
                        </div>

                        <div class="form-actions">
                            <button type="reset">Limpiar</button>
                            <button type="submit">Enviar</button>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </body>
</html>
