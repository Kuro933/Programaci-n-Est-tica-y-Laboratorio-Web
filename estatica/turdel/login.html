<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingresar — Turdel</title>
    <link rel="stylesheet" href="css/comun.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="page-wrapper">
        <header class="site-header">
            <div class="container header-inner">
                <a class="brand" href="index.html">
                    <img class="brand_logo" src="imagenes/padel_club_logo.png" alt="Logo Turdel">
                    <div class="brand_text">
                        <span class="brand__name">Reservas de pádel</span>
                        <span class="brand__title">TURDEL</span>
                    </div>
                </a>
                <nav class="nav" aria-label="Navegación principal">
                    <a class="nav_link" href="index.html">Inicio</a>
                    <a class="nav_link" href="canchas.html">Canchas</a>
                    <a class="nav_link nav__jugador" href="reservar.html">Reservar</a>
                    <a class="nav_link nav__jugador" href="mis-reservas.html">Mis reservas</a>
                    <a class="nav_link nav__jugador" href="partidos.html">Partidos</a>
                    <a class="nav_link nav__jugador" href="estadisticas.html">Estadísticas</a>
                    <a class="nav_link nav__club" href="panel-club.html" hidden>Panel del club</a>
                    <a class="nav_link nav__login is-active" href="login.html">Ingresar</a>
                    <a class="nav__cta nav__registro" href="registro.html">Registrarse</a>
                </nav>
            </div>
        </header>

        <main class="form-page">
            <div class="form-card">
                <h1>Ingresar</h1>
                <p class="form-card__sub">Accedé a tu cuenta para gestionar reservas y partidos.</p>

                <div id="alert-login" class="alert" role="alert" hidden></div>

                <form id="form-login" action="#" method="post" novalidate>
                    <div class="form-group">
                        <label for="login-email">Email</label>
                        <input type="email" id="login-email" name="email" placeholder="correo@ejemplo.com" required>
                        <p class="form-error">Ingresá un email válido.</p>
                    </div>

                    <div class="form-group">
                        <label for="login-contraseña">Contraseña</label>
                        <input type="password" id="login-contraseña" name="contraseña" placeholder="Tu contraseña" required minlength="6">
                        <p class="form-error">La contraseña es obligatoria.</p>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn--verde">Ingresar</button>
                    </div>
                </form>

                <p class="form-link">
                    ¿No tenés cuenta? <a href="registro.html">Registrate acá</a>
                </p>
            </div>
        </main>

        <footer class="site-footer">
            <div class="container footer-bottom">
                <p>&copy; 2026 Turdel</p>
            </div>
        </footer>
    </div>
    <script src="js/storage.js"></script>
    <script src="js/datos.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
